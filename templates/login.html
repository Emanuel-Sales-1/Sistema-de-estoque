{% extends "base.html" %}
{% block titulo %}Entrar · Controle de Estoque{% endblock %}

{% block conteudo %}
  <section class="painel cartao-login">
    <h1>Entrar</h1>
    <p class="sub">Use o usuário e a senha que o administrador criou para você.</p>
    <form action="{{ url_for('login') }}" method="POST">
      <div>
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" autocomplete="username" autofocus required>
      </div>
      <div>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <button class="primario">Entrar</button>
    </form>
  </section>
{% endblock %}
